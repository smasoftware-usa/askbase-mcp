[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "askbase-mcp"
version = "2.1.0"
description = "MCP server for ASK-base RAG API - enables AI assistants to search and manage your knowledge base"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "SMA Software USA"}
]
keywords = ["mcp", "rag", "askbase", "ai", "knowledge-base", "semantic-search"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "mcp>=2.2,<3",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "starlette>=0.38.0",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",
]

[project.scripts]
askbase-mcp = "askbase_mcp.server:main"

[project.urls]
Homepage = "https://github.com/smasoftware-usa/askbase-mcp"
Documentation = "https://github.com/smasoftware-usa/askbase-mcp#readme"
Repository = "https://github.com/smasoftware-usa/askbase-mcp"
Issues = "https://github.com/smasoftware-usa/askbase-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/askbase_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
